name: Counterexample reporting validation
on:
  push:
    branches: [validation/yvc84-counterexample-af2e]
permissions:
  contents: read
concurrency:
  group: yvc84-counterexample-af2e
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      SOURCE_SHA: 774557b19c071d5f4df346948b1cd974aa452db2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 774557b19c071d5f4df346948b1cd974aa452db2
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: yvc82-pause
      - name: Record exact source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD
          git hash-object src/fuzz.rs
          rustc --version
          cargo --version
      - name: Format the candidate
        run: cargo fmt --all
      - name: Retain the exact formatted source
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          paths = ['src/fuzz.rs', 'src/storage.rs']
          assert set(changed).issubset(set(paths)), changed
          metadata = {'source_sha': os.environ['SOURCE_SHA'], 'files': {}, 'format_changed': changed}
          print('YVC84_STORAGE_FORMAT_DIFF=' + json.dumps(subprocess.check_output(['git', 'diff', '--', 'src/storage.rs'], text=True)))
          for path in paths:
              data = Path(path).read_bytes()
              source = data.decode('utf-8')
              metadata['files'][path] = {'git_blob': subprocess.check_output(['git', 'hash-object', path], text=True).strip(), 'sha256': hashlib.sha256(data).hexdigest()}
              for start in range(0, len(source), 6000):
                  print('YVC84_SOURCE_CHUNK=' + json.dumps({'path': path, 'chunk': source[start:start+6000]}))
          Path(os.environ['RUNNER_TEMP'], 'yvc84-formatted.json').write_text(json.dumps(metadata))
          print('YVC84_SOURCE_END=' + json.dumps(metadata))
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run the maintained deterministic and contract tests
        run: cargo test --locked
      - name: Check production lint
        run: cargo clippy --lib --locked -- -D warnings
      - name: Build release Wasm
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: Confirm the tested source
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          metadata = json.loads(Path(os.environ['RUNNER_TEMP'], 'yvc84-formatted.json').read_text())
          for path, receipt in metadata['files'].items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == receipt['sha256'], path
          changed = subprocess.check_output(['git', 'diff', '--name-only', '--', 'src', 'Cargo.toml', 'Cargo.lock'], text=True).splitlines()
          assert set(changed).issubset(set(metadata['files'])), changed
          print('YVC84_TESTED_SOURCE=' + json.dumps(metadata))
