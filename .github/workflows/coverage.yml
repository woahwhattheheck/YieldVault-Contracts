name: Focused withdrawal period limit

on:
  push:
    branches: ["validation/yvc87-period-cap-20261004-relay1114"]

permissions:
  contents: read

jobs:
  period-limit:
    name: Reproduce and repair the period cap boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f7f7f3310571fb321295383c9d8979402083bb7c
          fetch-depth: 2
          persist-credentials: false

      - name: Install the repository's Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Reproduce the preceding cap overflow
        shell: bash
        run: |
          set -euo pipefail
          git show 208633a96602be8eccee0b7cf4550fe91e4e1b75:src/lib.rs > src/lib.rs
          set +e
          cargo test --locked test::test_period_limit_maximum_rejects_overflow_atomically -- --exact > "$RUNNER_TEMP/yvc87-baseline.log" 2>&1
          baseline_status=$?
          set -e
          cat "$RUNNER_TEMP/yvc87-baseline.log"
          test "$baseline_status" -eq 101
          grep -F "left: Ok(Ok(3))" "$RUNNER_TEMP/yvc87-baseline.log"
          grep -F "right: Err(Ok(WithdrawPeriodLimitExceeded))" "$RUNNER_TEMP/yvc87-baseline.log"

      - name: Run the same case on the published repair
        shell: bash
        run: |
          set -euo pipefail
          git show f7f7f3310571fb321295383c9d8979402083bb7c:src/lib.rs > src/lib.rs
          cargo test --locked test::test_period_limit_maximum_rejects_overflow_atomically -- --exact 2>&1 | tee "$RUNNER_TEMP/yvc87-repaired.log"
          grep -F "test result: ok. 1 passed; 0 failed;" "$RUNNER_TEMP/yvc87-repaired.log"
