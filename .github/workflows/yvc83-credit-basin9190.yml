name: YVC83 actual yield credit
on:
  push:
    branches: ["validation/yvc83-credit-basin9190"]
permissions:
  contents: read
concurrency:
  group: yvc83-credit-basin9190
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Reproduce and validate actual contract
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, time
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "yvc83-credit"
          out.mkdir()
          base = "064e2412d9845745bd2a8261149d5998bc831e0d"
          staged = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          report = {"base": base, "staged": staged, "checks": []}
          def run(name, command):
              started = time.perf_counter()
              p = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              (out / (name + ".log")).write_text(p.stdout)
              report["checks"].append({"name": name, "command": command, "exit": p.returncode, "seconds": time.perf_counter()-started})
              print(name, "exit", p.returncode, flush=True)
              print(p.stdout[-3000:], flush=True)
              (out / "report.json").write_text(json.dumps(report, indent=2))
              return p
          pathlib.Path("src/lib.rs").write_bytes(subprocess.check_output(["git", "show", base + ":src/lib.rs"]))
          baseline = run("baseline", ["cargo", "test", "--locked", "test_accrual_credit_", "--", "--nocapture"])
          if baseline.returncode != 101 or "1 passed; 3 failed;" not in baseline.stdout:
              raise SystemExit("Expected three assertion failures and one overflow control on baseline")
          pathlib.Path("src/lib.rs").write_bytes(subprocess.check_output(["git", "show", staged + ":src/lib.rs"]))
          if run("format", ["cargo", "fmt", "--all"]).returncode:
              raise SystemExit("Formatting failed")
          changed = subprocess.check_output(["git", "diff", "--name-only", "--", "*.rs"], text=True).splitlines()
          if any(p not in ("src/lib.rs", "src/test.rs") for p in changed):
              raise SystemExit("Formatter changed source outside the claimed files: " + repr(changed))
          report["source_sha256"] = {}
          for name in ("src/lib.rs", "src/test.rs"):
              data = pathlib.Path(name).read_bytes()
              (out / pathlib.Path(name).name).write_bytes(data)
              report["source_sha256"][name] = hashlib.sha256(data).hexdigest()
          report["rustc"] = subprocess.check_output(["rustc", "--version"], text=True).strip()
          report["cargo"] = subprocess.check_output(["cargo", "--version"], text=True).strip()
          (out / "product.patch").write_bytes(subprocess.check_output(["git", "diff", base, "--", "src/lib.rs", "src/test.rs"]))
          commands = [
              ("fmt-check", ["cargo", "fmt", "--all", "--", "--check"]),
              ("tests", ["cargo", "test", "--locked"]),
              ("clippy", ["cargo", "clippy", "--lib", "--locked", "--", "-D", "warnings"]),
              ("wasm-build", ["cargo", "build", "--release", "--target", "wasm32-unknown-unknown", "--locked"]),
          ]
          for name, command in commands:
              if run(name, command).returncode:
                  raise SystemExit(name + " failed")
          print(json.dumps(report, indent=2), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yvc83-credit-basin9190
          path: ${{ runner.temp }}/yvc83-credit
          retention-days: 30
